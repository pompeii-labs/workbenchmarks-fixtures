<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#140e0b" />
    <title>Espresso</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 40%, #2a1f19 0%, #120c09 70%);
        overscroll-behavior: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      h1 {
        position: fixed;
        left: max(20px, env(safe-area-inset-left));
        top: max(16px, env(safe-area-inset-top));
        margin: 0;
        font: 500 12px/1 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(236, 214, 190, 0.45);
        pointer-events: none;
      }
      .fallback {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(236, 214, 190, 0.6);
        font: 14px/1.4 system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <canvas id="stage" aria-label="A cup of espresso. Move the cursor or a finger across the cup to disturb the surface."></canvas>
    <h1>Espresso</h1>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
