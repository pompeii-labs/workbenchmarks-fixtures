<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120a0c" />
    <meta name="description" content="A pelican rides a unicycle and juggles three bowling pins, in real-time 3D." />
    <link rel="icon" href="data:," />
    <title>The Great Pelicano</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #120a0c; }
      body { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; color: #f1e4c8; }
      #scene { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; cursor: grab; outline: none; }
      #scene:active { cursor: grabbing; }
      #title {
        position: fixed; left: max(16px, env(safe-area-inset-left)); bottom: max(14px, env(safe-area-inset-bottom));
        margin: 0; font-size: 13px; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase;
        color: rgba(241, 228, 200, 0.62); pointer-events: none; user-select: none;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.6);
      }
      #loader {
        position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #3a1a1c, #120a0c 70%);
        transition: opacity 0.6s ease; z-index: 2;
      }
      #loader p { margin: 0; font-size: 14px; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(241, 228, 200, 0.75); text-align: center; padding: 0 24px; }
      #loader p::after { content: ""; display: block; width: 36px; height: 2px; margin: 14px auto 0; background: #c8202c; animation: pulse 1.2s ease-in-out infinite; }
      body.ready #loader { opacity: 0; pointer-events: none; }
      @keyframes pulse { 50% { transform: scaleX(2.2); opacity: 0.5; } }
      @media (prefers-reduced-motion: reduce) { #loader p::after { animation: none; } #loader { transition: none; } }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="A pelican riding a unicycle while juggling three bowling pins. Drag to look around."></canvas>
    <h1 id="title">The Great Pelicano</h1>
    <div id="loader" aria-hidden="true"><p>Setting up the ring</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
