<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Neon Pinball — a small 3D pinball table in Three.js. Two flippers, a spring plunger, lit bumpers, three balls per game." />
    <title>Neon Pinball</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪩</text></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <header id="hud">
        <div class="hud-block">
          <span class="hud-label">Score</span>
          <span id="score" class="hud-value">0</span>
        </div>
        <div class="hud-block center">
          <div id="title">NEON&nbsp;PINBALL</div>
          <div id="message">Hold SPACE to launch</div>
        </div>
        <div class="hud-block right">
          <span class="hud-label">High Score</span>
          <span id="highscore" class="hud-value">0</span>
        </div>
      </header>

      <div id="statusbar">
        <span class="pill">BALL <b id="ball">–</b> / 3</span>
        <span class="pill" id="lanes-pill">LANES <b id="lanes">○ ○ ○</b></span>
        <span class="pill">BONUS ×<b id="multiplier">1</b></span>
        <span class="pill" id="ballsave-pill" hidden>BALL SAVE</span>
      </div>

      <div id="gameover" hidden>
        <div class="go-card">
          <div class="go-title">GAME OVER</div>
          <div class="go-score">Score <b id="final-score">0</b></div>
          <div class="go-high" id="new-high" hidden>★ NEW HIGH SCORE ★</div>
          <button id="play-again" type="button">Play again&nbsp;&nbsp;⏎</button>
        </div>
      </div>

      <footer id="help">
        <span><kbd>◀</kbd><kbd>A</kbd> left flipper</span>
        <span><kbd>▶</kbd><kbd>D</kbd> right flipper</span>
        <span><kbd>SPACE</kbd> hold &amp; release — plunger</span>
        <span><kbd>↑</kbd> / <kbd>T</kbd> nudge</span>
        <span><kbd>M</kbd> sound</span>
        <span><kbd>P</kbd> pause</span>
      </footer>

      <div id="touch-controls">
        <button id="btn-left" class="touch-btn" type="button" aria-label="Left flipper">◀</button>
        <button id="btn-launch" class="touch-btn launch" type="button" aria-label="Launch ball">LAUNCH</button>
        <button id="btn-right" class="touch-btn" type="button" aria-label="Right flipper">▶</button>
      </div>

      <div id="paused" hidden>PAUSED — press P to resume</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
